# Runmark in herdr (ADR-025): the `rmk status --line` summary under each
# workspace in the sidebar, as the $runmark token. The plugin holds no
# logic of its own; rmk decides, the plugin relays.
#
# Show it by adding the token to ~/.config/herdr/config.toml:
#   [ui.sidebar.spaces]
#   rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$runmark"]]

id = "runmark.herdr"
name = "Runmark"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Runmark continuity in the sidebar: plan progress, open work and warnings for each workspace."
platforms = ["macos", "linux"]

# Tokens are not restored after a herdr restart: publish every workspace.
[[startup]]
command = ["sh", "runmark-herdr.sh", "startup"]

[[events]]
on = "workspace.created"
command = ["sh", "runmark-herdr.sh", "event"]

[[events]]
on = "worktree.created"
command = ["sh", "runmark-herdr.sh", "event"]

# Fires when an agent starts or finishes a turn: commits, notes and open work
# change there.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "runmark-herdr.sh", "event"]

# Actions run headless with the invocation context; each opens its popup in the
# focused pane's directory, where the work happens.
[[actions]]
id = "resume"
title = "Runmark: where did we leave off"
contexts = ["pane", "workspace"]
command = ["sh", "runmark-herdr.sh", "action", "resume"]

[[actions]]
id = "continue"
title = "Runmark: continue open work"
contexts = ["pane", "workspace"]
command = ["sh", "runmark-herdr.sh", "action", "continue"]

[[actions]]
id = "fix"
title = "Runmark: fix warnings"
contexts = ["pane", "workspace"]
command = ["sh", "runmark-herdr.sh", "action", "fix"]

[[actions]]
id = "projects"
title = "Runmark: all projects"
contexts = ["global", "pane", "workspace"]
command = ["sh", "runmark-herdr.sh", "action", "projects"]

[[panes]]
id = "resume"
title = "Runmark: where did we leave off"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/runmark-herdr.sh\" pane resume"]

[[panes]]
id = "continue"
title = "Runmark: continue open work"
placement = "popup"
width = "70%"
height = 20
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/runmark-herdr.sh\" pane continue"]

[[panes]]
id = "fix"
title = "Runmark: fix warnings"
placement = "popup"
width = "70%"
height = 20
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/runmark-herdr.sh\" pane fix"]

[[panes]]
id = "projects"
title = "Runmark: all projects"
placement = "popup"
width = "70%"
height = 20
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/runmark-herdr.sh\" pane projects"]
