name: Manual macOS release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tag, GitHub release and CLI archive (otherwise dry-run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: runmark-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
      - name: Verify tooling and source
        run: |
          npm --prefix tools/release ci --ignore-scripts
          npm --prefix tools/release test
          node tools/release/audit.mjs
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
          sh plugins/runmark-agent/test.sh
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            tools/release/node_modules/.bin/semantic-release
          else
            tools/release/node_modules/.bin/semantic-release --dry-run
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-diagnostics
          path: |
            build/artifacts/
            build/release/Testing/Temporary/
          retention-days: 14
